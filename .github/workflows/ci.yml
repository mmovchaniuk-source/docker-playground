name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API image
        run: docker build -t marianamovchaniuk/docker-playground-api:ci ./api

      - name: Run API container
        run: docker run -d --name api-test -p 3000:3000 marianamovchaniuk/docker-playground-api:ci 

      - name: Test API health
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Tag API image
        run: docker tag marianamovchaniuk/docker-playground-api:ci marianamovchaniuk/docker-playground-api:latest

      - name: Push API image
        run: docker push marianamovchaniuk/docker-playground-api:latest

