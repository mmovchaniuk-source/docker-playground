services:
  web:
    image: marianamovchaniuk/docker-playground-web:v1
    ports:
      - "8083:8080"
    restart: unless-stopped

  api:
    image: marianamovchaniuk/docker-playground-api:v1
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - app-data:/data
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  app-data:
