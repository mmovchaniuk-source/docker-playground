<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Playground</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(-45deg, #0f172a, #312e81, #164e63, #0f172a);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
    }

    .card {
      width: min(90%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.25);
    }

    .logo {
      font-size: 56px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 5vw, 42px);
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      font-size: 14px;
    }

    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🐳</div>
    <h1>Docker Playground</h1>
    <p>It works inside Docker!</p>
    <p>Маленький проєкт, великі можливості.</p>
    <div class="status">● Project initialized</div>
  </main>
</body>
</html>
